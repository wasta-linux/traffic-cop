[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-cop"
description = "Set and monitor per-app bandwidth limits."
readme = "README.md"
authors = [
    {name = "Nate Marti", email = "nate_marti@sil.org"},
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "PyYAML>=5.4",
]
# The daemon also needs the official nftables bindings (`import nftables`),
# which aren't on PyPI: apt install python3-nftables, and create the venv
# with --system-site-packages.

[project.optional-dependencies]
# The GUI uses tkinter, which is in the standard library (on Debian/Ubuntu:
# apt install python3-tk).
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/wasta-linux/traffic-cop"
Issues = "https://github.com/wasta-linux/traffic-cop/issues"

[project.scripts]
traffic-copd = "trafficcop.daemon.__main__:main"
traffic-cop-ctl = "trafficcop.cli.__main__:main"

[project.gui-scripts]
traffic-cop = "trafficcop.gui.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "trafficcop.__version__"}

# [tool.setuptools.packages.find]
# where = ["src"]

[tool.setuptools.package-data]
# Ship these inside the package so they can be found with
# importlib.resources rather than hard-coded /usr/share paths.
"trafficcop.common" = ["traffic-cop.yaml.default"]
"trafficcop" = ["locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --ignore=tests/legacy"
markers = [
    "integration: needs root; runs real nft/tc inside a network namespace",
]

[tool.coverage.run]
source = ["trafficcop"]
branch = true

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# Packages only available from apt (python3-nftables, later python3-gi). The
# venv is created with --system-site-packages, but pyright ignores that.
extraPaths = ["/usr/lib/python3/dist-packages"]

[tool.ruff]
line-length = 88
target-version = "py310"
# The old GTK code is kept for reference only; never reformat it.
extend-exclude = ["src/trafficcop/legacy", "tests/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
